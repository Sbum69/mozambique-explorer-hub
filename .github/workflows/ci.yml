name: CI

# Type check, unit tests, lint and production build on every PR and on pushes to main.
# No secrets: the build reads only the public VITE_* values committed in .env.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bunx vitest run

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # public/licenses.json is not checked: the prebuild step regenerates it on every build, so the
      # published list is always right, and checking it would fail every dependency update PR.
      - name: Generated route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts

      # Warning mode: bun audit has no production-only option. Since zod 4 (chore/deps-pre-launch) the
      # remaining high advisories are in build tooling (miniflare, wrangler, devtools, the route
      # generator's own zod 3), not in the code that is published. A high advisory in a package of
      # "dependencies" that reaches the browser or the Worker is fixed before merge. See docs/security/REVISAO.md.
      - name: Dependency audit (high and above, warning mode)
        continue-on-error: true
        run: bun audit --audit-level=high
